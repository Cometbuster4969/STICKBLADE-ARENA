[pytest]
# Bare `pytest` must only ever collect the isolated suite in tests/.
#
# WHY THIS FILE EXISTS
# --------------------
# stickblade/ contains five `test_*.py` files that are PROCEDURAL SCRIPTS,
# not pytest modules: test_bow_mobility.py, test_headless.py, test_phases.py,
# test_model_stats_supabase.py, test_preference_pairs_supabase.py. They run
# full matches at import time (and write battle_log_*.json into the CWD)
# because their "test" is the trailing assertion block, not a function.
#
# Without `testpaths`, a bare `pytest` from the repo root walks the whole
# tree, imports those scripts, executes real simulations as a side effect,
# and dies with `INTERNALERROR> SystemExit: 0` (test_bow_mobility.py:313).
# CI never noticed because it always runs `pytest tests/`.
#
# `testpaths` fixes the bare-`pytest` case. The explicit-argument case
# (`pytest stickblade/`) is handled by stickblade/conftest.py, which lists
# the same scripts in `collect_ignore_glob` — so the landmine is defused
# without rewriting 300 lines of working script into a function body.
#
# NOTE: python_files / python_classes / python_functions are NOT set here on
# purpose — they would only restate pytest's own defaults (test_*.py,
# Test*, test_*) and create a second source of truth to keep in sync.
testpaths = tests

# Keep collection out of vendor/venv/artifact trees if someone runs
# `pytest .` or `pytest --rootdir=.`.
norecursedirs = .git .venv venv __pycache__ node_modules .next arena_data build dist
