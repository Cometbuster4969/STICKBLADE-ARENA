# =============================================================================
# Per-model matchup counts (auto-verified by tools/audit_frozen_pack.py)
# =============================================================================
# Distribution: min 7, max 10 slots per model. All models >= 5, which is the
# joint-filter threshold for the cross-benchmark correlation study (per
# research/cross_benchmark_correlation_report_2026-08-04.md).
#
# 21 distinct models × ~9.5 avg slots = 200 total slots = 100 matches × 2 sides.
#
# Full audit (regenerate with: python3 tools/audit_frozen_pack.py):
#   openai/gpt-oss-20b:free                              → 10 slots
#   google/gemma-4-31b-it:free                           → 10 slots
#   google/gemma-4-26b-a4b-it:free                       → 10 slots
#   nvidia/nemotron-3-super-120b-a12b:free               →  9 slots
