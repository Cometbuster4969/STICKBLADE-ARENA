# Stickblade Arena — Frozen Evaluation Pack v1
# ==============================================
#
# This is the canonical 100-matchup test suite. Every model on the roster
# plays every match in this pack. Results are deterministic per seed (as
# much as pymunk's collision-order allows), reproducible across runs, and
# published as a CSV alongside METHODOLOGY.md.
#
# Purpose (per TIMELINE.md Tier-A #4):
#   * Give every model >= 10 matches per axis, unblocking the cross-
#     benchmark correlation study (research/cross_benchmark_correlation.py)
#   * Provide a citable, downloadable static benchmark for external
#     researchers who don't want to trust the live leaderboard
#   * Serve as the regression suite for prompt_version changes: bumping
#     PROMPT_VERSION reruns this pack, diff of Elo tells you if the
#     schema change materially changed model behavior
#
# Design decisions (locked in 2026-08-13, session log):
#
#   1. FIXED PROMPT VERSION = 1. Reruns MUST use this. If the runtime
#      says PROMPT_VERSION != 1, the runner aborts. Any bump requires
#      a v2 pack with new baseline results.
#
#   2. 100 matches total (deliberate — matches TIMELINE.md spec of
#      "20 per weapon × 5 [weapons] = 100").
#
#   3. Distribution: 20 matches per weapon × 5 weapons = 100.
#      Each weapon uses its DEFAULT sharp zone (first entry in
#      WEAPON_ZONES per weapon). Multi-sharp variation is a v2 concern.
#
#   4. Model selection per match uses a fixed round-robin from an
#      ordered ELIGIBLE_MODELS list. This guarantees:
#        - Every model appears in >= 10 matches
#        - Every ordered (A, B) pair is unique OR repeated with fixed
#          seed variation
#        - No model plays itself (self-play is zero-information for
#          the correlation study)
#
#   5. Seeds are deterministic: hash("stickblade-frozen-v1:{i}") mod
#      2^31. Same seed always produces the same match trajectory
#      (subject to pymunk floating-point non-determinism, which is
#      logged as a threat-to-validity in METHODOLOGY.md § 7).
#
#   6. All matches use:
#        mode        = "macro"       (the default; joint mode is a
#                                     separate axis, not v1 scope)
#        arena       = "normal"      (ice / low_gravity are v2 scope)
#        blindfolded = false         (blindfolded is a separate axis)
#      This keeps the pack focused on the primary rating cell.
#
#   7. Non-LLM baseline bots (bot:random/greedy/distance/pro) are
#      INCLUDED. They're the noise floor per METHODOLOGY.md § 5.1.
#      Every LLM should beat bot:random and ideally bot:pro.
#
#   8. Mock brains (mock:duelist/mock:berserker) are EXCLUDED from
#      the frozen pack. They're for smoke-testing the pipeline, not
#      for scientific comparison.

# =============================================================================
# Configuration
# =============================================================================

pack_version: 1
prompt_version_required: 1     # runner aborts if backend reports != this
created: "2026-08-13"
author: "Ayush (Cometbuster4969)"

# The exact URL the runner posts to. Changing this = a different pack.
backend_base_url: "https://pioneer37-stickman-arena.hf.space"

# =============================================================================
# Eligible models — the roster snapshot as of 2026-08-13
# =============================================================================
# Verified live via `curl /api/models` at pack creation time.
# Mocks are excluded (see design decision 8).
# Order matters — round-robin uses this order.

eligible_models:
  # --- LLMs (18) ---
  - openai/gpt-oss-20b:free                              # OR :free, small/fast
  - google/gemma-4-31b-it:free                           # OR :free, mid
  - google/gemma-4-26b-a4b-it:free                       # OR :free, mid MoE
  - nvidia/nemotron-3-super-120b-a12b:free               # OR :free, large
  - nvidia/nemotron-3-ultra-550b-a55b:free               # OR :free, xlarge
  - nvidia/nemotron-3-nano-30b-a3b:free                  # OR :free, small
  - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free   # OR :free, reasoning
  - nvidia/nemotron-nano-9b-v2:free                      # OR :free, tiny
  - cohere/north-mini-code:free                          # OR :free, code-tuned
  - poolside/laguna-xs-2.1:free                          # OR :free, small
  - openai/gpt-4o-mini                                   # OR paid, small/fast
  - groq:llama-3.3-70b-versatile                         # Groq, large
  - groq:llama-3.1-8b-instant                            # Groq, small
  - groq:openai/gpt-oss-120b                             # Groq, xlarge
  - groq:openai/gpt-oss-20b                              # Groq, small
  - groq:deepseek-r1-distill-llama-70b                   # Groq, reasoning
  - groq:moonshotai/kimi-k2-instruct                     # Groq, mid
  # --- Non-LLM baselines (4) — the noise floor ---
  - bot:random
  - bot:greedy
  - bot:distance
  - bot:pro
  # Note: 22 eligible entries total. openrouter/free (auto-router) is
  # excluded because its selected model varies per-call, making
  # reproducibility across pack reruns impossible.

